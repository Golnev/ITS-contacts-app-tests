services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins_ITS
    ports:
      - "8585:8080"
      - "50000:50000"
    volumes:
      - jenkins_ITS:/var/jenkins_ITS
      - /var/run/docker.sock:/var/run/docker.sock
    build:
      context: .
      dockerfile: Dockerfile

volumes:
  jenkins_ITS: